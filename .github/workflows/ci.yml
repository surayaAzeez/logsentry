name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Generate sample logs
        run: python scripts/generate_sample_logs.py --out data/

      - name: Test
        run: pytest --cov=logsentry --cov-report=term-missing

      - name: Smoke test the CLI end to end
        run: |
          logsentry rules
          # Exit code 1 means findings were reported, which is the expected
          # outcome against sample logs that contain planted attacks.
          logsentry scan data/auth.log data/access.log --html report.html || true
          test -s report.html

      - name: Upload HTML report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: logsentry-report
          path: report.html
